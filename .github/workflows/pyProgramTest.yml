name: Python NLP Model application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # If you want flake8 or pytest, keep them installed:
          pip install flake8 pytest nbconvert
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download NLTK Data
        run: |
          python -m nltk.downloader stopwords wordnet

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # This steps executes the python notebook from top to bottom
      - name: Execute Jupyter Notebook
        run: |
          jupyter nbconvert --to notebook --execute Sentiment_Analysis_IMDB_Dataset.ipynb --output output.ipynb

          - name: Upload Model Artifact
          uses: actions/upload-artifact@v3
          with:
            name: sentiment-model
            path: model.pkl

      # Working on building test cases      
